
{% extends "base.html" %}

{% block title %}Product Catalogue{% endblock %}

{% block content %}
    <h1>Product Catalogue</h1>
    <div class="product-list">
        {% for product in products %}
            <div class="product-card">
                <img src="{{ product[5] }}" alt="{{ product[1] }}" width="150">
                <h3>{{ product[1] }}</h3>
                <p>Category: {{ product[3] }}</p>
                <p>Price: ${{ "%.2f"|format(product[2]) }}</p>
                <p>Stock: {{ product[4] }}</p>
                <button class="btn btn-outline-primary" onclick="addToCart('{{ product[0] }}', '{{ product[1] }}', {{ product[2] }}, '{{ product[5] }}')">Add to Cart</button>
            </div>
            
        {% endfor %}
    </div>
{% endblock %}
