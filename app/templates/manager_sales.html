<h3>📈 Sales Overview</h3>

<div class="sales-summary">
  <p>Total Sales: {{ total_sales }}</p>
  <p>Total Revenue: ${{ "%.2f"|format(total_revenue) }}</p>
</div>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Sale ID</th>
      <th>Customer</th>
      <th>Date</th>
      <th>Total</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody>
    {% for sale in sales %}
    <form method="POST" action="/manager/sale/update/{{ sale.id }}">
        <tr>
            <td>{{ sale.id }}</td>
            <td>{{ sale.customer_name }}</td>
            <td>{{ sale.date }}</td>
            <td>${{ "%.2f"|format(sale.total) }}</td>
            <td>
            <select name="status" onchange="this.form.submit()">
                <option value="pending" {% if sale.status == 'pending' %}selected{% endif %}>Pending</option>
                <option value="paid" {% if sale.status == 'paid' %}selected{% endif %}>Paid</option>
                <option value="shipped" {% if sale.status == 'shipped' %}selected{% endif %}>Shipped</option>
                <option value="cancelled" {% if sale.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
            </select>
            <button type="submit" class="btn btn-sm btn-primary">Update</button>
            </td>
        </tr>
        </form>

    {% endfor %}

  </tbody>
</table>
