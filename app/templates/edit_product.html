{% extends "base.html" %}
{% block title %} Edit Product{% endblock %}

{% block content %}
<h2>Edit Product</h2>
<form method="POST" action="/manager/product/edit/{{ product.id }}">
  <div class="mb-3">
    <label class="form-label">Product Name:</label>
    <input type="text" class="form-control" name="name" value="{{ product.name }}" required><br>

    <label class="form-label">Price: $</label>
    <input type="number" step="0.01" class="form-control" name="price" value="{{ product.price }}" required><br>

    <label class="form-label">Stock:</label>
    <input type="number" class="form-control" name="stock" value="{{ product.stock }}" required><br>

    
    {% if product.image_url %}
        <img src="{{ product.image_url }}" alt="Product Image" class="img-thumbnail mb-2" width="200"><br>
    {% endif %}
    <label class="form-label">Upload New Image:</label>
    <input type="file" class="form-control" name="image"><br><br>

    <button type="submit" class="btn btn-primary">Update Product</button>
  </div>
</form>
<a href="/manager/dashboard" class="btn btn-secondary mt-3">Back to Dashboard</a>
{% endblock %}
