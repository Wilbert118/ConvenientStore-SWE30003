{% extends "base.html" %}
{% block title %}Update Delivery Status{% endblock %}

{% block content %}
<h1>Update Delivery for Sale #{{ delivery.sale_id }}</h1>

<form method="POST">
    <label for="status">Delivery Status:</label>
    <select name="status" id="status" required>
        <option value="pending" {% if delivery.status == "pending" %}selected{% endif %}>Pending</option>
        <option value="shipped" {% if delivery.status == "shipped" %}selected{% endif %}>Shipped</option>
        <option value="delivered" {% if delivery.status == "delivered" %}selected{% endif %}>Delivered</option>
    </select>
    <br><br>
    <button type="submit" class="btn btn-success">Update Status</button>
</form>

<a href="/delivery/dashboard">← Back to Dashboard</a>
{% endblock %}
