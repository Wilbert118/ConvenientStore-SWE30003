{% extends "base.html" %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
  <h2 class="mb-4 text-center">Create Your Account</h2>
  <form method="POST" action="/signup">
    <div class="mb-3">
      <label for="email" class="form-label">Email address</label>
      <input type="email" class="form-control" id="email" name="email" required>
    </div>
    <div class="mb-3">
      <label for="name" class="form-label">Username</label>
      <input type="text" class="form-control" id="name" name="name" required minlength="3">
    </div>
    <div class="mb-3">
      <label for="address" class="form-label">Address</label>
      <input type="text" class="form-control" id="address" name="address" required minlength="5">
    </div>
    <div class="mb-3">
      <label for="phone" class="form-label">Phone Number</label>
      <input type="tel" class="form-control" id="phone" name="phone" required pattern="^\+?\d{8,15}$">
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name="password" required minlength="6">
    </div>
    <div class="mb-3">
      <label class="form-label">Role</label><br>
      <input type="radio" id="customer" name="role" value="customer" checked>
      <label for="customer">Customer</label><br>

      <input type="radio" id="delivery" name="role" value="delivery">
      <label for="delivery">Delivery Person</label>
    </div>


    <button type="submit" class="btn btn-primary w-100">Sign Up</button>
    <p class="mt-3 text-center">Already have an account? <a href="/login">Log in</a></p>
  </form>
</div>
{% endblock %}
